name: Verify nested schema compatibility and full suite

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pyhf-nested-schema-full-suite
  cancel-in-progress: false

jobs:
  full-suite:
    name: ${{ matrix.profile }} on Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - python: '3.12'
            profile: strict-full
          - python: '3.14'
            profile: upstream-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYHF_RESULTS: /tmp/pyhf-nested-schema-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
    steps:
      - name: Check out exact production candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dhairyajangir/pyhf
          ref: 10c0d1f166015a3505994cce451413bb87c8d379
          fetch-depth: 0
          persist-credentials: false

      - name: Set up supported default Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}

      - name: Verify source and prepare results
        shell: bash
        run: |
          mkdir -p "$PYHF_RESULTS"
          test "$(git rev-parse HEAD)" = 10c0d1f166015a3505994cce451413bb87c8d379
          test "$(git rev-parse HEAD^{tree})" = 5702b38a96747d0e1e0ffb8cfb7fb174c6ce1a9d
          git status --porcelain=v1 > "$PYHF_RESULTS/source-status-before.txt"
          test ! -s "$PYHF_RESULTS/source-status-before.txt"
          git show --no-patch --format=fuller HEAD > "$PYHF_RESULTS/source-commit.txt"
          git ls-tree -r HEAD > "$PYHF_RESULTS/source-tree.txt"

      - name: Install full declared test environment
        shell: bash
        run: |
          python -m pip install uv
          uv pip install --system --upgrade ".[all]" --group test 'jupyter-client<8.0.0' 2>&1 | tee "$PYHF_RESULTS/install.log"
          python -m pip check 2>&1 | tee "$PYHF_RESULTS/pip-check.log"
          python -m pip list --format=json > "$PYHF_RESULTS/packages.json"
          python --version > "$PYHF_RESULTS/python-version.txt"

      - name: Verify installed runtime matches candidate
        shell: bash
        run: |
          python - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          import pyhf

          checkout = Path.cwd().resolve()
          package = Path(pyhf.__file__).resolve().parent
          assert not package.is_relative_to(checkout), package
          checks = []
          for source in sorted((checkout / "src/pyhf").rglob("*")):
              if source.suffix not in {".py", ".json"} or source.name == "_version.py":
                  continue
              if "__pycache__" in source.parts:
                  continue
              relative = source.relative_to(checkout / "src/pyhf")
              installed = package / relative
              assert installed.is_file(), str(relative)
              expected = hashlib.sha256(source.read_bytes()).hexdigest()
              actual = hashlib.sha256(installed.read_bytes()).hexdigest()
              assert actual == expected, str(relative)
              checks.append({"path": str(relative), "sha256": actual})
          assert hashlib.sha256((checkout / "src/pyhf/schema/__init__.py").read_bytes()).hexdigest() == "91e49bbdc3936e2651a045e52157a48daa47135c32c87bfbc0d2abed0aa6a748"
          assert hashlib.sha256((checkout / "tests/test_schema.py").read_bytes()).hexdigest() == "4685f779a41e8b6334d09968c0de4bcfd641e150b800f66962ea07ebf9751bc6"
          result = {"candidate": "10c0d1f166015a3505994cce451413bb87c8d379", "tree": "5702b38a96747d0e1e0ffb8cfb7fb174c6ce1a9d", "python": sys.version, "executable": sys.executable, "package_origin": str(package), "schema_origin": pyhf.schema.__file__, "version_metadata": pyhf.__version__, "installed_file_checks": checks}
          (Path(os.environ["PYHF_RESULTS"]) / "installed-provenance.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps({key: value for key, value in result.items() if key != "installed_file_checks"}, indent=2))
          print(f"Verified {len(checks)} installed Python/schema files against exact candidate")
          PYTHON

      - name: Reproduce Python 3.14 collection failure on unchanged upstream
        if: matrix.profile == 'upstream-ci'
        shell: bash
        run: |
          git checkout --detach 2c99d0b7cfa703c3798c6588312857c5b3e97d51
          test "$(git rev-parse HEAD^{tree})" = 2cdce70dfbaa1ef694168c341668ad0472be8f0f
          uv pip install --no-cache --system --force-reinstall --no-deps . 2>&1 | tee "$PYHF_RESULTS/baseline-install.log"
          python - <<'PYTHON'
          import hashlib
          import importlib.metadata
          import json
          import os
          from pathlib import Path
          import pyhf
          import sys
          actual = hashlib.sha256(Path(pyhf.schema.__file__).read_bytes()).hexdigest()
          assert actual == "0d2b5a1ca506740ac6ae8f4e5f94983d6dcf1569c37a21fbd9d24520cbdfdee3"
          assert importlib.metadata.version("jupyter-client") == "7.4.9"
          record = {"source": "2c99d0b7cfa703c3798c6588312857c5b3e97d51", "python": sys.version, "pyhf": pyhf.__file__, "schema": pyhf.schema.__file__, "schema_sha256": actual, "jupyter-client": importlib.metadata.version("jupyter-client"), "nbclient": importlib.metadata.version("nbclient"), "papermill": importlib.metadata.version("papermill")}
          (Path(os.environ["PYHF_RESULTS"]) / "baseline-provenance.json").write_text(json.dumps(record, indent=2) + "\n")
          PYTHON
          set +e
          python -m pytest --collect-only tests/test_notebooks.py --junitxml="$PYHF_RESULTS/baseline-collection.xml" 2>&1 | tee "$PYHF_RESULTS/baseline-collection.log"
          baseline_collection_exit=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$baseline_collection_exit" > "$PYHF_RESULTS/baseline-collection.exit"
          test "$baseline_collection_exit" = 2
          python - <<'PYTHON'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          folder = Path(os.environ["PYHF_RESULTS"])
          errors = list(ET.parse(folder / "baseline-collection.xml").getroot().iter("error"))
          assert len(errors) == 2, len(errors)
          for error in errors:
              assert "DeprecationWarning: Parsing dates involving a day of month without a year specified is ambiguous" in error.text
              assert "jupyter_client/jsonutil.py" in error.text
          PYTHON
          git checkout --detach 10c0d1f166015a3505994cce451413bb87c8d379
          test "$(git rev-parse HEAD^{tree})" = 5702b38a96747d0e1e0ffb8cfb7fb174c6ce1a9d
          uv pip install --no-cache --system --force-reinstall --no-deps . 2>&1 | tee "$PYHF_RESULTS/candidate-restored-install.log"
          python -m pip check

      - name: Reverify exact candidate runtime after baseline replay
        if: matrix.profile == 'upstream-ci'
        shell: bash
        run: |
          python - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          import pyhf

          checkout = Path.cwd().resolve()
          package = Path(pyhf.__file__).resolve().parent
          assert not package.is_relative_to(checkout), package
          checks = []
          for source in sorted((checkout / "src/pyhf").rglob("*")):
              if source.suffix not in {".py", ".json"} or source.name == "_version.py":
                  continue
              if "__pycache__" in source.parts:
                  continue
              relative = source.relative_to(checkout / "src/pyhf")
              installed = package / relative
              assert installed.is_file(), str(relative)
              expected = hashlib.sha256(source.read_bytes()).hexdigest()
              actual = hashlib.sha256(installed.read_bytes()).hexdigest()
              assert actual == expected, str(relative)
              checks.append({"path": str(relative), "sha256": actual})
          assert hashlib.sha256((checkout / "src/pyhf/schema/__init__.py").read_bytes()).hexdigest() == "91e49bbdc3936e2651a045e52157a48daa47135c32c87bfbc0d2abed0aa6a748"
          assert hashlib.sha256((checkout / "tests/test_schema.py").read_bytes()).hexdigest() == "4685f779a41e8b6334d09968c0de4bcfd641e150b800f66962ea07ebf9751bc6"
          result = {"candidate": "10c0d1f166015a3505994cce451413bb87c8d379", "tree": "5702b38a96747d0e1e0ffb8cfb7fb174c6ce1a9d", "python": sys.version, "executable": sys.executable, "package_origin": str(package), "schema_origin": pyhf.schema.__file__, "version_metadata": pyhf.__version__, "installed_file_checks": checks}
          (Path(os.environ["PYHF_RESULTS"]) / "restored-installed-provenance.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps({key: value for key, value in result.items() if key != "installed_file_checks"}, indent=2))
          print(f"Verified {len(checks)} installed Python/schema files against exact candidate")
          PYTHON

      - name: Run complete default pytest suite
        if: matrix.profile == 'strict-full'
        shell: bash
        run: |
          set +e
          python -m pytest --junitxml="$PYHF_RESULTS/full-pytest.xml" 2>&1 | tee "$PYHF_RESULTS/full-pytest.log"
          full_pytest_exit=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$full_pytest_exit" > "$PYHF_RESULTS/full-pytest.exit"
          exit "$full_pytest_exit"

      - name: Run upstream strict core CI check on Python 3.14
        if: matrix.profile == 'upstream-ci'
        shell: bash
        run: |
          set +e
          coverage run --module pytest --ignore tests/contrib --ignore tests/benchmarks --ignore tests/test_notebooks.py --junitxml="$PYHF_RESULTS/core-pytest.xml" 2>&1 | tee "$PYHF_RESULTS/core-pytest.log"
          core_pytest_exit=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$core_pytest_exit" > "$PYHF_RESULTS/core-pytest.exit"
          exit "$core_pytest_exit"

      - name: Run upstream contrib image-comparison check
        shell: bash
        run: |
          set +e
          python -m pytest tests/contrib --mpl --mpl-baseline-path tests/contrib/baseline --junitxml="$PYHF_RESULTS/contrib-pytest.xml" 2>&1 | tee "$PYHF_RESULTS/contrib-pytest.log"
          contrib_pytest_exit=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$contrib_pytest_exit" > "$PYHF_RESULTS/contrib-pytest.exit"
          exit "$contrib_pytest_exit"

      - name: Run upstream source and README doctest check
        shell: bash
        run: |
          set +e
          python -m pytest src/ README.rst --junitxml="$PYHF_RESULTS/doctest-pytest.xml" 2>&1 | tee "$PYHF_RESULTS/doctest-pytest.log"
          doctest_pytest_exit=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$doctest_pytest_exit" > "$PYHF_RESULTS/doctest-pytest.exit"
          exit "$doctest_pytest_exit"

      - name: Run upstream notebook check on Python 3.14
        if: matrix.profile == 'upstream-ci'
        shell: bash
        run: |
          set +e
          python -m pytest --verbose --override-ini filterwarnings= tests/test_notebooks.py --junitxml="$PYHF_RESULTS/notebook-pytest.xml" 2>&1 | tee "$PYHF_RESULTS/notebook-pytest.log"
          notebook_pytest_exit=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$notebook_pytest_exit" > "$PYHF_RESULTS/notebook-pytest.exit"
          exit "$notebook_pytest_exit"

      - name: Run default benchmarks on Python 3.14
        if: matrix.profile == 'upstream-ci'
        shell: bash
        run: |
          set +e
          python -m pytest tests/benchmarks --junitxml="$PYHF_RESULTS/benchmark-pytest.xml" 2>&1 | tee "$PYHF_RESULTS/benchmark-pytest.log"
          benchmark_pytest_exit=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$benchmark_pytest_exit" > "$PYHF_RESULTS/benchmark-pytest.exit"
          exit "$benchmark_pytest_exit"

      - name: Record final tracked-source status
        if: always()
        shell: bash
        run: |
          git status --porcelain=v1 > "$PYHF_RESULTS/source-status-after.txt"
          git diff --exit-code HEAD -- .

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pyhf-nested-schema-${{ matrix.profile }}
          path: ${{ env.PYHF_RESULTS }}/
          if-no-files-found: error
          retention-days: 14
